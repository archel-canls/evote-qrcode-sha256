version: "3.9"

services:
  db:
    image: postgres:15
    container_name: evote-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evote
    ports:
      - "5432:5432"
    volumes:
      - evote_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: evote-app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST=db
      DB_USER=postgres
      DB_PASS=postgres
      DB_NAME=evote
      DB_PORT=5432
      SERVER_PORT=8080

volumes:
  evote_data: