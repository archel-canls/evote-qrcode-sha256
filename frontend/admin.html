<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
:root{
  --primary:#2563eb;
  --primary-soft:#eef2ff;
  --danger:#dc2626;
  --success:#16a34a;
  --bg:#f1f5f9;
  --dark:#0f172a;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,#e0e7ff,#f8fafc);
  margin:0;
  min-height:100vh;
  color:var(--text);
}

/* ===== CONTAINER ===== */
.container{
  max-width:1000px;
  margin:70px auto;
  padding:34px;
  background:#fff;
  border-radius:24px;
  box-shadow:
    0 10px 30px rgba(15,23,42,.08),
    0 40px 80px rgba(15,23,42,.06);
  animation:fade .5s ease;
}

.hidden{display:none}

/* ===== TYPOGRAPHY ===== */
h1{
  font-size:26px;
  font-weight:700;
  margin:0 0 8px;
}

h2{
  font-size:18px;
  font-weight:600;
  margin:0;
}

p{
  color:var(--muted);
  margin:0 0 18px;
}

/* ===== FORM ===== */
input,button{
  width:100%;
  padding:14px 16px;
  margin-top:14px;
  border-radius:var(--radius);
  font-size:15px;
}

input{
  border:1px solid var(--border);
  background:#fff;
}
input::placeholder{
  color:#94a3b8;
}
input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.18);
}

/* ===== BUTTON ===== */
button{
  border:none;
  font-weight:600;
  cursor:pointer;
  transition:.25s ease;
}

button.primary{
  background:var(--primary);
  color:#fff;
}
button.primary:hover{
  box-shadow:0 12px 28px rgba(37,99,235,.35);
}

button.danger{
  background:#fee2e2;
  color:#991b1b;
}
button.danger:hover{
  background:#fecaca;
}

.btn-sm{
  width:auto;
  padding:8px 14px;
  font-size:13px;
}

/* ===== STATUS ===== */
.status{
  margin-top:12px;
  font-size:14px;
}
.status.error{color:var(--danger)}
.status.success{color:var(--success)}

/* ===== PASSWORD ===== */
.pass-wrap{position:relative}
.pass-wrap span{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  opacity:.5;
}

/* ===== DASHBOARD ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px;
}

/* ===== CARD ===== */
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
}

th{
  background:var(--primary-soft);
  text-align:left;
  font-size:13px;
  font-weight:600;
  color:#334155;
  padding:14px;
}

td{
  padding:14px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

tr:hover{
  background:#f8fafc;
}

td:last-child{
  display:flex;
  gap:8px;
}

/* ===== SKELETON ===== */
.skeleton{
  height:14px;
  background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb);
  border-radius:6px;
  animation:shimmer 1.3s infinite;
}
@keyframes shimmer{
  0%{background-position:-200px}
  100%{background-position:200px}
}

/* ===== TOAST ===== */
.toast{
  position:fixed;
  bottom:30px;
  right:30px;
  background:var(--dark);
  color:white;
  padding:14px 22px;
  border-radius:14px;
  font-size:14px;
  opacity:0;
  transform:translateY(20px);
  transition:.35s;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.modal.hidden{display:none}

.modal-box{
  background:white;
  padding:28px;
  width:100%;
  max-width:420px;
  border-radius:20px;
}

/* ===== ANIMATION ===== */
@keyframes fade{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
</style>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox">
  <h1>🔐 Admin Login</h1>
  <p>Masuk untuk mengelola kandidat voting</p>

  <input id="username" placeholder="Username">
  <div class="pass-wrap">
    <input id="password" type="password" placeholder="Password">
    <span onclick="togglePass()">👁</span>
  </div>

  <button class="primary" id="loginBtn">Login</button>
  <div id="loginStatus" class="status"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="topbar">
    <h1>📊 Dashboard Admin</h1>
    <button class="danger btn-sm" onclick="logout()">Logout</button>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>📋 Data Kandidat</h2>
      <button class="primary btn-sm" onclick="openAddModal()">➕ Tambah</button>
    </div>

    <input id="search" placeholder="Cari kandidat..." oninput="filterCandidates()">

    <table>
      <thead>
        <tr>
          <th width="60">ID</th>
          <th>Nama</th>
          <th>Deskripsi</th>
          <th width="120">Aksi</th>
        </tr>
      </thead>
      <tbody id="candidateTable"></tbody>
    </table>
  </div>
</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modalTitle">Tambah Kandidat</h2>

    <input type="hidden" id="candidateId">
    <input id="candidateName" placeholder="Nama Kandidat">
    <input id="candidateDesc" placeholder="Deskripsi">

    <div class="modal-actions">
      <button class="primary" onclick="saveCandidate()">Simpan</button>
      <button class="danger" onclick="closeModal()">Batal</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const loginBox = document.getElementById('loginBox');
const dashboard = document.getElementById('dashboard');
const loginBtn = document.getElementById('loginBtn');
const loginStatus = document.getElementById('loginStatus');
const toast = document.getElementById('toast');
const table = document.getElementById('candidateTable');
const modal = document.getElementById('modal');

let candidates=[];

function toastMsg(msg){
  toast.innerText = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),2600);
}

function togglePass(){
  password.type = password.type === 'password' ? 'text' : 'password';
}

loginBtn.onclick = async ()=>{
  loginBtn.disabled=true;
  loginBtn.innerText='Masuk...';

  try{
    const res = await fetch('/api/admin/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:username.value,
        password:password.value
      })
    });

    if(!res.ok) throw '';
    localStorage.setItem('admin','true');
    toastMsg('Login berhasil');
    showDashboard();
  }catch{
    loginStatus.className='status error';
    loginStatus.innerText='Login gagal';
  }finally{
    loginBtn.disabled=false;
    loginBtn.innerText='Login';
  }
};

function showDashboard(){
  loginBox.classList.add('hidden');
  dashboard.classList.remove('hidden');
  loadCandidates();
}

function logout(){
  localStorage.removeItem('admin');
  location.reload();
}

async function loadCandidates(){
  table.innerHTML = `
    <tr><td colspan="4"><div class="skeleton"></div></td></tr>
    <tr><td colspan="4"><div class="skeleton"></div></td></tr>
  `;
  const res = await fetch('/api/admin/candidates');
  candidates = await res.json();
  renderCandidates(candidates);
}

function renderCandidates(list){
  table.innerHTML = list.length
    ? ''
    : `<tr><td colspan="4" style="text-align:center;color:#64748b">Tidak ada data</td></tr>`;

  list.forEach(c=>{
    table.innerHTML += `
      <tr>
        <td>${c.ID}</td>
        <td>${c.Name}</td>
        <td>${c.Description || '-'}</td>
        <td>
          <button class="btn-sm" onclick='openEditModal(${JSON.stringify(c)})'>Edit</button>
          <button class="danger btn-sm" onclick="deleteCandidate(${c.ID})">Hapus</button>
        </td>
      </tr>`;
  });
}

function filterCandidates(){
  const q = search.value.toLowerCase();
  renderCandidates(candidates.filter(c=>c.Name.toLowerCase().includes(q)));
}

function openAddModal(){
  modal.classList.remove('hidden');
  modalTitle.innerText='Tambah Kandidat';
  candidateId.value='';
  candidateName.value='';
  candidateDesc.value='';
}

function openEditModal(c){
  modal.classList.remove('hidden');
  modalTitle.innerText='Edit Kandidat';
  candidateId.value=c.ID;
  candidateName.value=c.Name;
  candidateDesc.value=c.Description||'';
}

function closeModal(){
  modal.classList.add('hidden');
}

async function saveCandidate(){
  const id = candidateId.value;

  const res = await fetch(
    id ? `/api/admin/candidates/${id}` : `/api/admin/candidates`,
    {
      method: id ? 'PUT' : 'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        Name: candidateName.value,
        Description: candidateDesc.value
      })
    }
  );

  if(res.ok){
    toastMsg('Data berhasil disimpan');
    closeModal();
    loadCandidates();
  }else{
    const err = await res.text();
    console.error(err);
    toastMsg('Gagal menyimpan data');
  }
}

async function deleteCandidate(id){
  if(!confirm('Hapus kandidat ini?')) return;
  const res = await fetch(`/api/admin/candidates/${id}`,{method:'DELETE'});
  if(res.ok){
    toastMsg('Data dihapus');
    loadCandidates();
  }
}

if(localStorage.getItem('admin')) showDashboard();
</script>

</body>
</html>
