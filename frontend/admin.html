<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - E-Voting SHA-256</title>

<style>
:root {
  --primary: #2563eb;
  --secondary: #64748b;
  --success: #10b981;
  --danger: #dc2626;
  --warning: #f59e0b;
  --bg: #f8fafc;
  --card: #ffffff;
}

body {
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  margin: 0;
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR NAVIGATION */
.sidebar {
  width: 260px;
  background: #1e293b;
  color: white;
  padding: 20px;
  position: fixed;
  height: 100vh;
}
.sidebar h2 { font-size: 1.2rem; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
.nav-link {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  color: #cbd5e1;
  text-decoration: none;
  border-radius: 8px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: 0.3s;
}
.nav-link:hover, .nav-link.active { background: var(--primary); color: white; }
.logout-btn { color: #f87171; margin-top: 50px; border: 1px solid #450a0a; }
.logout-btn:hover { background: #450a0a; }

/* MAIN CONTENT */
.main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
.tab-content { display: none; animation: fadeIn 0.4s ease; }
.tab-content.active { display: block; }

.card {
  background: var(--card);
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  margin-bottom: 30px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.2s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-print { background: var(--success); color: white; margin-bottom: 20px; }
.btn-danger { background: var(--danger); color: white; }

input, textarea {
  width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px;
  border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box;
}

table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
th { background: #f8fafc; color: var(--secondary); font-size: 0.85rem; text-transform: uppercase; }

/* WINNER BADGE */
.winner-row { background: #ecfdf5 !important; border-left: 5px solid var(--success); }
.badge { padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
.badge-winner { background: var(--success); color: white; }
.rank { font-weight: bold; color: var(--secondary); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* PRINT STYLES */
@media print {
  .sidebar, button, .no-print { display: none !important; }
  .main-content { margin: 0; padding: 0; width: 100%; }
  .card { box-shadow: none; border: 1px solid #eee; }
  .tab-content { display: block !important; }
  #manage-section { display: none !important; }
  body { background: white; }
}
</style>
</head>

<body>

<div class="sidebar no-print">
  <h2>Admin E-Voting</h2>
  <div class="nav-link active" onclick="switchTab('manage-section', this)">🛠️ Kelola Kandidat</div>
  <div class="nav-link" onclick="switchTab('result-section', this)">🏆 Hasil Perhitungan</div>
  <div class="nav-link logout-btn" onclick="logout()">🚪 Logout</div>
</div>

<div class="main-content">

  <div id="manage-section" class="tab-content active">
    <div class="card">
      <h3>➕ Tambah Kandidat Baru</h3>
      <input id="name" type="text" placeholder="Nama lengkap kandidat">
      <textarea id="description" rows="2" placeholder="Visi & Misi singkat"></textarea>
      <button class="btn-primary" onclick="addCandidate()">Tambah Kandidat</button>
    </div>

    <div class="card">
      <h3>📊 Daftar Kandidat</h3>
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">ID</th>
            <th>Nama</th>
            <th>Deskripsi</th>
            <th style="width: 100px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="candidateTable"></tbody>
      </table>
    </div>
  </div>

  <div id="result-section" class="tab-content">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>🏆 Laporan Hasil Perolehan Suara</h3>
        <button class="btn-print no-print" onclick="window.print()">🖨️ Cetak PDF</button>
      </div>
      <p class="no-print">Urutan berdasarkan perolehan suara terbanyak.</p>

      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Posisi</th>
            <th>Nama Kandidat</th>
            <th>Total Suara</th>
            <th>Persentase</th>
          </tr>
        </thead>
        <tbody id="resultTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const token = localStorage.getItem("admin_token");
if (!token) {
  alert("Akses ditolak! Silakan login.");
  window.location.href = "/admin/login";
}

// FUNGSI NAVIGASI
function switchTab(tabId, element) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  element.classList.add('active');

  if(tabId === 'result-section') loadResults();
  if(tabId === 'manage-section') loadCandidates();
}

function logout() {
  if(confirm("Apakah Anda ingin logout?")) {
    localStorage.removeItem("admin_token");
    window.location.href = "/admin/login";
  }
}

// --- LOGIKA KANDIDAT ---
async function loadCandidates() {
  try {
    const res = await fetch("/api/admin/candidates", {
      headers: { "Authorization": "Bearer " + token }
    });
    if (res.status === 401) return logout();
    const data = await res.json();
    const tbody = document.getElementById("candidateTable");
    tbody.innerHTML = "";
    data.forEach(c => {
      tbody.innerHTML += `
        <tr>
          <td>${c.id}</td>
          <td><strong>${c.name}</strong></td>
          <td>${c.description || '-'}</td>
          <td><button class="btn-danger" onclick="deleteCandidate(${c.id})">Hapus</button></td>
        </tr>`;
    });
  } catch (err) { console.error(err); }
}

async function addCandidate() {
  const name = document.getElementById("name").value.trim();
  const description = document.getElementById("description").value.trim();
  if (!name) return alert("Nama wajib diisi!");

  const res = await fetch("/api/admin/candidates", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ name, description })
  });
  if (res.ok) {
    document.getElementById("name").value = "";
    document.getElementById("description").value = "";
    loadCandidates();
  }
}

async function deleteCandidate(id) {
  if (!confirm("Hapus kandidat ini?")) return;
  await fetch(`/api/admin/candidates/${id}`, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  });
  loadCandidates();
}

// --- LOGIKA HASIL (SORTED & PDF READY) ---
async function loadResults() {
  try {
    const res = await fetch("/api/admin/results", {
      headers: { "Authorization": "Bearer " + token }
    });
    let data = await res.json();
    
    // URUTKAN BERDASARKAN SUARA TERBANYAK
    data.sort((a, b) => b.vote_count - a.vote_count);
    
    const totalVotes = data.reduce((sum, item) => sum + parseInt(item.vote_count), 0);
    const tbody = document.getElementById("resultTable");
    tbody.innerHTML = "";

    data.forEach((item, index) => {
      const percentage = totalVotes > 0 ? ((item.vote_count / totalVotes) * 100).toFixed(1) : 0;
      const isWinner = index === 0 && item.vote_count > 0;
      
      tbody.innerHTML += `
        <tr class="${isWinner ? 'winner-row' : ''}">
          <td class="rank">#${index + 1}</td>
          <td>
            <strong>${item.name}</strong>
            ${isWinner ? '<span class="badge badge-winner">🏆 PEMENANG</span>' : ''}
          </td>
          <td>${item.vote_count} Suara</td>
          <td>
            <div style="background:#e2e8f0; width:100px; border-radius:10px; display:inline-block; margin-right:10px;">
              <div style="background:var(--primary); width:${percentage}%; height:8px; border-radius:10px;"></div>
            </div>
            ${percentage}%
          </td>
        </tr>`;
    });
  } catch (err) { console.error(err); }
}

// Inisialisasi awal
loadCandidates();
</script>

</body>
</html>
