<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Admin</title>

<style>
body{
  font-family: Segoe UI, sans-serif;
  background:#eef2ff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  background:white;
  padding:30px;
  border-radius:14px;
  width:340px;
  box-shadow:0 15px 30px rgba(0,0,0,.1);
}
h2{
  text-align:center;
  margin-bottom:20px;
}
label{
  font-weight:600;
}
input{
  width:100%;
  padding:10px;
  margin-top:8px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #cbd5f5;
}
button{
  width:100%;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#4f46e5;
  color:white;
  font-weight:600;
  cursor:pointer;
}
button:disabled{
  background:#a5b4fc;
  cursor:not-allowed;
}
.alert{
  margin-bottom:12px;
  padding:10px;
  border-radius:8px;
  font-size:14px;
}
.error{
  background:#fee2e2;
  color:#991b1b;
}
/* Navbar style */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px 30px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  z-index: 1000;
  box-sizing: border-box;
}
.navbar a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: 0.3s;
}
.navbar a:hover {
  opacity: 0.8;
  transform: translateX(-5px);
}

body {
  padding-top: 60px; 
}
</style>
</head>

<body>
  <nav class="navbar">
    <a href="/">← Kembali ke Beranda</a>
  </nav>
<div class="card">
  <h2>Login Admin</h2>

  <div id="alert"></div>

  <form onsubmit="adminLogin(event)">
    <label>Username</label>
    <input id="username" required>

    <label>Password</label>
    <input id="password" type="password" required>

    <button id="btnLogin" type="submit">Login</button>
  </form>
</div>

<script>
async function adminLogin(event){
    event.preventDefault();

    const btn = document.getElementById("btnLogin");
    const alertBox = document.getElementById("alert");
    alertBox.innerHTML = "";

    btn.disabled = true;
    btn.innerText = "Logging in...";

    try {
        const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });

        const data = await res.json();

        if(!res.ok){
            alertBox.innerHTML =
              `<div class="alert error">${data.message || "Login gagal"}</div>`;
            btn.disabled = false;
            btn.innerText = "Login";
            return;
        }

        // simpan token JWT
        localStorage.setItem("admin_token", data.token);

        // redirect ke dashboard admin
        window.location.href = "/admin";

    } catch (err) {
        alertBox.innerHTML =
          `<div class="alert error">Server tidak merespon</div>`;
        btn.disabled = false;
        btn.innerText = "Login";
    }
}
</script>

</body>
</html>
