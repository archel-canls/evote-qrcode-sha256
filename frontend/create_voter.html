<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Voter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#4f46e5; color:#fff; }
        .container { background: rgba(255,255,255,0.12); padding: 30px; border-radius:16px; text-align:center; width:400px; }
        input, button { padding:10px; margin:8px 0; width:100%; border-radius:8px; border:none; }
        button { background:#06b6d4; color:#fff; font-weight:bold; cursor:pointer; }
        button:hover { opacity:0.9; }
        #qr-display img { margin-top:10px; width:200px; height:200px; background: white; padding: 10px; border-radius: 8px; }
        #token { word-break: break-all; font-family: monospace; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; }
        /* Navbar style */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px 30px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  z-index: 1000;
  box-sizing: border-box;
}
.navbar a {
  color: white;
  text-decoration: none;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: 0.3s;
}
.navbar a:hover {
  opacity: 0.8;
  transform: translateX(-5px);
}

body {
  padding-top: 60px; 
}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/">← Kembali ke Beranda</a>
      </nav>
    <div class="container">
        <h2>📝 Daftar Voter</h2>
        <input type="text" id="name" placeholder="Nama lengkap" />
        <input type="email" id="email" placeholder="Email" />
        <button id="btnDaftar" onclick="createVoter()">Daftar & Dapatkan Token</button>

        <div id="qr-display" style="display:none;">
            <h3>Token Anda</h3>
            <p id="token"></p>
            <img id="qr-image" src="" alt="QR Code" />
            <button onclick="downloadQR()" style="background: #10b981;">💾 Download QR</button>
        </div>
    </div>

    <script>
 async function createVoter() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const btn = document.getElementById("btnDaftar");

    if (!name || !email) { alert("Isi semua kolom!"); return; }

    btn.disabled = true;
    btn.innerText = "Memproses...";

    try {
        const res = await fetch("/api/voters/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ name, email })
        });

        const data = await res.json();

        if (res.ok) {
            // Tampilkan pesan dari server (bisa pesan "Berhasil" atau "Email sudah digunakan")
            alert(data.message); 

            // Tampilkan Short Token (kode sederhana) ke elemen UI
            document.getElementById("token").innerText = data.voter.short_token;
            
            // Masukkan gambar QR Base64 ke elemen img
            document.getElementById("qr-image").src = data.qr; 
            
            document.getElementById("qr-display").style.display = "block";
        } else {
            alert("Gagal: " + (data.error || "Terjadi kesalahan"));
        }
    } catch(err) {
        alert("Server tidak merespon. Pastikan rute /api/voters/register sudah benar.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Daftar & Dapatkan Token";
    }
}

    function downloadQR() {
        const img = document.getElementById("qr-image");
        if (!img.src || img.src === window.location.href) {
            alert("Gambar QR belum tersedia!");
            return;
        }
        
        const link = document.createElement("a");
        link.href = img.src;
        link.download = "voter_token_qr.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    </script>
</body>
</html>
