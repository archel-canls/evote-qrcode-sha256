<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗳️ E-Voting - Scan & Vote</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background:#06b6d4; color:#fff; display:flex; justify-content:center; padding: 20px; margin: 0; }
        .container { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 25px; border-radius:16px; width:100%; max-width:480px; text-align:center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        
        /* --- PEMBARUAN VISUAL SCANNER --- */
        .scanner-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #reader { 
            width: 100%; 
            border: none !important; /* Hapus border default library */
        }

        /* Garis pemindai animasi */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(74, 222, 128, 0.8);
            box-shadow: 0 0 15px 5px rgba(74, 222, 128, 0.5);
            z-index: 10;
            pointer-events: none;
            animation: moveLine 2.5s ease-in-out infinite;
            display: none; /* Muncul hanya saat kamera aktif */
        }

        @keyframes moveLine {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* Dekorasi sudut (High-tech corners) */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid #fff;
            z-index: 20;
            pointer-events: none;
        }
        .top-left { top: 10px; left: 10px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
        .top-right { top: 10px; right: 10px; border-left: none; border-bottom: none; border-radius: 0 4px 0 0; }
        .bottom-left { bottom: 10px; left: 10px; border-right: none; border-top: none; border-radius: 0 0 0 4px; }
        .bottom-right { bottom: 10px; right: 10px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }

        /* Sembunyikan elemen internal library yang mengganggu */
        #reader img[alt="Info icon"] { display: none; }
        #reader button { 
            background: #4f46e5 !important; 
            color: white !important; 
            border: none !important; 
            padding: 8px 15px !important; 
            border-radius: 6px !important;
            font-weight: bold;
        }

        /* --- STYLE LAINNYA --- */
        .upload-section { border: 2px dashed rgba(255,255,255,0.5); padding: 15px; border-radius: 12px; margin: 15px 0; background: rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; }
        .upload-section:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
        input, button { padding:12px; margin:10px 0; width:100%; border-radius:8px; border:none; box-sizing: border-box; }
        button { background:#4f46e5; color:#fff; font-weight:bold; cursor:pointer; transition: 0.3s; }
        button:hover { background: #3730a3; }
        .candidate-card { background:#fff; color:#1e293b; padding:15px; margin:12px 0; border-radius:12px; cursor:pointer; text-align: left; transition: 0.2s; border: 3px solid transparent; }
        .candidate-card:hover { border-color: #4f46e5; transform: scale(1.02); }
        #voting-section, #qr-result, #loading { display: none; }
        .step-title { font-size: 1.2rem; margin-bottom: 10px; display: block; font-weight: bold; }
        
        .navbar { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 30px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); display: flex; align-items: center; z-index: 1000; box-sizing: border-box; }
        .navbar a { color: white; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        body { padding-top: 80px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/">← Kembali ke Beranda</a>
    </nav>

    <div class="container">
        <h2>🗳️ Sistem E-Voting</h2>

        <div id="auth-section">
            <span class="step-title">Langkah 1: Verifikasi Identitas</span>
            
            <div class="scanner-wrapper">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="scan-line" id="animated-line"></div>
                <div id="reader"></div> 
            </div>
            
            <div class="upload-section" onclick="document.getElementById('qr-input-file').click()">
                <span>🖼️ Pilih Gambar QR dari Perangkat</span>
                <input type="file" id="qr-input-file" accept="image/*" style="display:none">
            </div>

            <p style="margin: 10px 0;">— ATAU —</p>
            <input type="text" id="token-input" placeholder="Masukkan 6 digit kode token manual">
            <button onclick="verifyVoter()">Verifikasi & Lanjut</button>
        </div>

        <div id="loading">
            <p>🔄 Memproses Identitas...</p>
        </div>

        <div id="voting-section">
            <span class="step-title">Langkah 2: Gunakan Hak Suara Anda</span>
            <div id="candidate-list"></div>
        </div>

        <div id="qr-result">
            <h3 style="color: #4ade80;">✅ Vote Berhasil!</h3>
            <p>Hash Suara (SHA-256):</p>
            <div id="vote-hash" style="font-size: 0.7rem; margin-bottom: 10px; word-break: break-all; opacity: 0.8;"></div>
            <img id="result-qr" style="width: 200px; background: #fff; padding: 10px; border-radius: 10px;" />
            <button onclick="location.reload()" style="background: #64748b;">Kembali ke Beranda</button>
        </div>
    </div>

    <script>
        // Inisialisasi Scanner [cite: 25]
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15, // Peningkatan FPS agar garis terlihat lebih mulus
            qrbox: {width: 250, height: 250},
            rememberLastUsedCamera: true
        });
        
        html5QrcodeScanner.render(onScanSuccess);

        // Pantau kapan kamera aktif untuk memunculkan garis scan
        const observer = new MutationObserver(() => {
            const line = document.getElementById("animated-line");
            const video = document.querySelector("#reader video");
            if (video) {
                line.style.display = "block";
            } else {
                line.style.display = "none";
            }
        });
        observer.observe(document.getElementById("reader"), { childList: true, subtree: true });

        function onScanSuccess(decodedText) {
            document.getElementById("token-input").value = decodedText;
            html5QrcodeScanner.clear(); 
            verifyVoter();
        }

        const fileInput = document.getElementById('qr-input-file');
        fileInput.addEventListener('change', e => {
            if (e.target.files.length == 0) return;
            const imageFile = e.target.files[0];
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    document.getElementById("token-input").value = decodedText;
                    verifyVoter();
                })
                .catch(err => {
                    alert("Gagal membaca QR!");
                    console.error(err);
                });
        });

        async function verifyVoter() {
            const token = document.getElementById("token-input").value.trim();
            if (!token) return alert("Pindai QR atau masukkan kode!");
            document.getElementById("auth-section").style.display = "none";
            document.getElementById("loading").style.display = "block";
            try {
                const res = await fetch("/api/candidates");
                const candidates = await res.json();
                if (res.ok) {
                    showCandidates(candidates);
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("voting-section").style.display = "block";
                } else { throw new Error("Gagal memuat kandidat"); }
            } catch (err) { alert(err.message); location.reload(); }
        }

        function showCandidates(list) {
            const container = document.getElementById("candidate-list");
            container.innerHTML = "";
            list.forEach(c => {
                container.innerHTML += `
                    <div class="candidate-card" onclick="submitVote(${c.id})">
                        <strong>${c.name}</strong><br>
                        <small>${c.description || 'Visi & Misi tersedia di profil.'}</small>
                    </div>
                `;
            });
        }

        async function submitVote(candidateId) {
            if (!confirm("Konfirmasi: Anda yakin dengan pilihan ini?")) return;
            const token = document.getElementById("token-input").value.trim();
            try {
                const res = await fetch("/api/vote", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ token, candidate_id: candidateId })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById("voting-section").style.display = "none";
                    document.getElementById("qr-result").style.display = "block";
                    document.getElementById("result-qr").src = data.qr;
                    document.getElementById("vote-hash").innerText = data.hash;
                } else { alert("Vote Gagal: " + (data.error || "Terjadi kesalahan")); location.reload(); }
            } catch (err) { alert("Kesalahan koneksi ke server."); }
        }
    </script>
</body>
</html>
